name: Build Study Mate APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Proyek ini belum punya Gradle Wrapper (gradlew), jadi Gradle-nya
      # disediakan langsung oleh action ini dengan versi yang dikunci manual.
      # Gradle 8.9 kompatibel dengan Android Gradle Plugin 8.5.2 yang dipakai di build.gradle.kts.
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build APK Debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14